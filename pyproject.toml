[project]
name = "postgres-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahzaib_Dev", email = "shahzaibsheikh355@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "mcp-use>=1.7.0",
    "mcp[cli]>=1.29.0",
    "nest-asyncio>=1.6.0",
    "praisonaiagents>=1.6.168",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
postgres-mcp = "postgres_mcp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
